spring.application.name=hrms

# ============================================================
# DATABASE  (real values come from environment variables on the server;
#            the fallbacks here are SAFE PLACEHOLDERS only \u2014 never real secrets)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/technext_hrms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHANGE_ME_IN_ENV}
spring.datasource.driver-class-name=org.postgresql.Driver

# FIX: Connection pool tuning to prevent 500 errors under load
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=none
# FIX: disable show-sql in production to avoid leaking query structure in logs
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=+05:30

# ============================================================
# JACKSON
# ============================================================
# Jackson 3 in Spring Boot 4 serializes dates as ISO-8601 strings by default,
# so WRITE_DATES_AS_TIMESTAMPS is no longer needed.
spring.jackson.time-zone=Asia/Kolkata

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:8080}
# FIX: Return proper JSON error body from /error instead of Spring's default HTML.
# (Each property on its OWN line \u2014 these were concatenated before, so
#  include-binding-errors was silently ignored.)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ============================================================
# JWT  (real secret MUST be provided via the JWT_SECRET env variable in prod;
#        the placeholder below is intentionally NOT a usable secret)
# ============================================================
app.jwt.secret=${JWT_SECRET:PLACEHOLDER_SET_A_REAL_64_CHAR_SECRET_IN_ENV_DO_NOT_USE_THIS}
app.jwt.access-token-expiration-ms=28800000
app.jwt.refresh-token-expiration-ms=604800000

# ============================================================
# CORS  (comma-separated list; override in production via CORS_ORIGINS)
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ============================================================
# DEFAULT SUPER ADMIN  (created on first run if no users exist;
#                       set a real one via env, and change it after first login)
# ============================================================
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@example.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:CHANGE_ME_IN_ENV}

# ============================================================
# EMAIL  \u2014 sent via Microsoft Graph API (app-only / client-credentials),
#          using the Azure AD App Registration "TechNext HRMS Mailer".
#          Real values come from environment variables in production \u2014 the
#          blank/placeholder fallbacks here are SAFE, never real secrets.
# ============================================================
# Master switch: if false, the app never attempts to send mail (useful for
# local/dev environments) \u2014 nothing else breaks either way, the employee is
# still created normally.
app.mail.enabled=${MAIL_ENABLED:false}
# The mailbox Graph sends AS (must be a real, licensed mailbox in the tenant
# that Mail.Send application permission covers). Also used as the "From" shown
# to recipients.
app.mail.from=${MAIL_FROM:hr@technnext.com}
app.company.name=${COMPANY_NAME:TechNext HRMS}
# Base URL of the frontend login page, included in the welcome email.
app.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:5173/login}

# Azure AD App Registration (Microsoft Graph, application permissions: Mail.Send,
# admin-consented). Get these from portal.azure.com -> App registrations ->
# TechNext HRMS Mailer -> Overview (tenant/client id) and Certificates & secrets
# (client secret value \u2014 copy it immediately, Azure only shows it once).
azure.graph.tenant-id=${AZURE_TENANT_ID:}
azure.graph.client-id=${AZURE_CLIENT_ID:}
azure.graph.client-secret=${AZURE_CLIENT_SECRET:}

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# LOGGING  (reduce noise in production)
# ============================================================
spring.devtools.restart.enabled=false
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.security=WARN
logging.level.com.technnext.hrms=INFO

# ============================================================
# FLYWAY  (database migrations \u2014 tables can never be missing again)
# ============================================================
# Migrations live in src/main/resources/db/migration as V<n>__name.sql
spring.flyway.enabled=true
# baseline-on-migrate: accept the EXISTING database as the starting point
# (version 1) instead of trying to recreate the tables already there.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing schema baseline
# Don't fail if a migration was applied out of order during development.
spring.flyway.out-of-order=true