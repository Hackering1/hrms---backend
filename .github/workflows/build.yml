name: Backend build

on:
  push:
    branches: [main, feat/full-hrms-suite]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile application and test sources
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
